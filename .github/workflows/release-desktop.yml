# The desktop app, built and attached to a release.
#
# Tauri cannot cross-compile: the window is the system's own webview, so each
# platform needs its own runner. Only Linux is built here for now, because it is
# the only one that needs no money to be openable — an unsigned .dmg tells macOS
# users their download is "damaged", and an unsigned .exe puts SmartScreen in
# front of it. Adding those later is a matter of extending the matrix and buying
# the certificates.
#
# The companion is compiled into the bundle by tauri.conf.json's
# beforeBuildCommand (npm run desktop:sidecar), which needs Deno and reads the
# target triple from rustc — both installed below.
#
# Ubuntu 22.04 on purpose: an AppImage links against the glibc of the machine
# that built it, so building on the newest Ubuntu would refuse to start on
# anything older.

name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the draft release under (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  # No FUSE on a runner: the AppImage tools run by extracting themselves.
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  appimage:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install the webview and its build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            build-essential \
            file \
            wget

      - name: Install dependencies
        run: npm ci

      - name: Build the AppImage
        run: npx tauri build --bundles appimage

      # An AppImage built on 22.04 carries that release's Wayland libraries, and
      # on a newer desktop they lose to the host's: WebKit's rendering process
      # dies with "Could not create default EGL display" and the window is blank
      # — which is exactly what the first release did. Every desktop that runs a
      # Wayland app already has these, so the AppImage is repacked without them.
      - name: Repack without the bundled Wayland libraries
        run: |
          cd src-tauri/target/release/bundle/appimage
          APPIMAGE=$(ls *.AppImage)
          APPDIR=$(ls -d *.AppDir)
          rm -f "$APPIMAGE" "$APPDIR"/usr/lib/libwayland-*.so.*
          ARCH=x86_64 OUTPUT="$APPIMAGE" ~/.cache/tauri/linuxdeploy-plugin-appimage.AppImage --appdir "$APPDIR"
          ls -lh "$APPIMAGE"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          FILE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          NOTES=$(cat <<'EOF'
          **Linux (AppImage)** — download it, `chmod +x`, run it. Nothing to install.

          It opens `~/tangent-notebooks` the first time; File → Open folder… opens another. On first launch it writes a desktop entry and an icon under `~/.local/share` so your dock knows what it is; delete `tangent-note.desktop` and `tangent-note.png` there to undo that.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A draft rebuilt from a moved tag: replace the file and the notes,
            # so a draft never describes a build it does not hold.
            gh release upload "$TAG" "$FILE" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --draft --title "tangent/note $TAG" --notes "$NOTES" "$FILE"
          fi
