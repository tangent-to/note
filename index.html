<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Tangent Notebook</title>
        <meta
            name="description"
            content="A local-first JavaScript notebook that runs in the browser. Write, run, and visualize data in reactive cells."
        />
        <!-- The app logo, bundled from source: Vite rewrites this to the hashed
             asset at build time, so there is no second copy to keep in step. -->
        <link rel="icon" type="image/svg+xml" href="/src/assets/images/logo.svg" />
        <script>
            // Apply the saved/system theme before first paint to avoid a flash.
            (function () {
                try {
                    var stored = localStorage.getItem("tangent-theme");
                    var theme =
                        stored === "light" || stored === "dark"
                            ? stored
                            : window.matchMedia &&
                                window.matchMedia("(prefers-color-scheme: dark)")
                                    .matches
                              ? "dark"
                              : "light";
                    document.documentElement.setAttribute("data-theme", theme);
                } catch (e) {
                    document.documentElement.setAttribute("data-theme", "light");
                }
            })();
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script src="./src/main.ts" type="module"></script>
    </body>
</html>
